name: Build and Publish Release Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Cache or Download Flet Desktop Client Archive
        shell: pwsh
        run: |
          if (-not (Test-Path "flet-windows.zip")) {
            Write-Host "Downloading flet-windows.zip v1.0.4..."
            Invoke-WebRequest -Uri "https://github.com/flet-dev/flet/releases/download/v1.0.4/flet-windows.zip" -OutFile "flet-windows.zip"
          }
          Write-Host "flet-windows.zip is ready. Size: $((Get-Item 'flet-windows.zip').Length) bytes."

      - name: Build Standalone Windows Executable
        run: |
          python -m PyInstaller --clean --noconfirm SpeechToText.spec

      - name: Sign Standalone Windows Executable
        shell: pwsh
        run: |
          Write-Host "Creating Authenticode Code Signing Certificate..."
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=The0Sanity, O=Speech-To-Text Open Source" -KeyAlgorithm RSA -KeyLength 2048 -CertStoreLocation "Cert:\CurrentUser\My" -NotAfter (Get-Date).AddYears(5)
          Write-Host "Signing dist\SpeechToText.exe..."
          try {
            $sig = Set-AuthenticodeSignature -FilePath "dist\SpeechToText.exe" -Certificate $cert -TimestampServer "http://timestamp.digicert.com" -HashAlgorithm SHA256
            Write-Host "Timestamped signature status: $($sig.Status)"
          } catch {
            Write-Warning "Timestamp server failed, signing locally: $_"
            $sig = Set-AuthenticodeSignature -FilePath "dist\SpeechToText.exe" -Certificate $cert -HashAlgorithm SHA256
            Write-Host "Local signature status: $($sig.Status)"
          }

      - name: Compute SHA256 Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 "dist\SpeechToText.exe").Hash
          Set-Content -Path "dist\SpeechToText.exe.sha256" -Value $hash -Encoding utf8
          Write-Host "Generated SHA256: $hash"

      - name: Resolve Release Tag Name
        id: resolve_tag
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag_name }}"
          if (-not $tag -or $tag -eq "") {
            $tag = "${{ github.ref_name }}"
          }
          if ($tag -eq "main" -or $tag -eq "master") {
            $tag = "v1.0.0"
          }
          Write-Host "Resolved release tag: $tag"
          "release_tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Generate Release Patch Notes
        shell: pwsh
        run: |
          python scripts/generate_patch_notes.py `
            --tag "${{ steps.resolve_tag.outputs.release_tag }}" `
            --changelog "CHANGELOG.md" `
            --sha256 "dist/SpeechToText.exe.sha256" `
            --output "release_notes.md" `
            --repo "${{ github.repository }}"
          Write-Host "Generated release_notes.md:"
          Get-Content "release_notes.md"

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve_tag.outputs.release_tag }}
          name: Speech-To-Text ${{ steps.resolve_tag.outputs.release_tag }}
          draft: false
          prerelease: false
          body_path: release_notes.md
          files: |
            dist/SpeechToText.exe
            dist/SpeechToText.exe.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
