name: Build and Publish Release Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build Standalone Windows Executable
        run: |
          python -m PyInstaller --clean --noconfirm SpeechToText.spec

      - name: Compute SHA256 Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 "dist\SpeechToText.exe").Hash
          Set-Content -Path "dist\SpeechToText.exe.sha256" -Value $hash -Encoding utf8
          Write-Host "Generated SHA256: $hash"

      - name: Resolve Release Tag Name
        id: resolve_tag
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag_name }}"
          if (-not $tag -or $tag -eq "") {
            $tag = "${{ github.ref_name }}"
          }
          if ($tag -eq "main" -or $tag -eq "master") {
            $tag = "v1.0.0"
          }
          Write-Host "Resolved release tag: $tag"
          "release_tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve_tag.outputs.release_tag }}
          name: Speech-To-Text ${{ steps.resolve_tag.outputs.release_tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/SpeechToText.exe
            dist/SpeechToText.exe.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
